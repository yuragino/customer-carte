<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>花火大会登録フォーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Custom Script -->
  <script type="module" src="../assets/js/hanabi/form.js"></script>
  <!-- AutoKana（名前入力からふりがなを自動反映） -->
  <script src="https://cdn.jsdelivr.net/npm/vanilla-autokana/dist/autokana.min.js" defer></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <!-- Styles -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/sanitize.css">
  <link rel="stylesheet" href="../assets/css/common/layout.css">
  <link rel="stylesheet" href="../assets/css/hanabi/form.css">
</head>

<body x-data="app">
  <header class="header" x-show="!selectedImageUrl">
    <div class="header-inner">
      <h1 class="header-title"><a href="../index.html">着付予約管理</a></h1>
      <div class="header-controls">
        <button type="button" @click="prevYear()" class="year-nav-btn" aria-label="前年度">&lsaquo;</button>
        <input type="number" min="2025" max="2060" step="1" x-model.number="selectedYear" @change="changeYear" class="text-black">
        <button type="button" @click="nextYear()" class="year-nav-btn" aria-label="次年度">&rsaquo;</button>
        <span>花火大会</span>
      </div>
      <nav class="header-nav">
        <a :href="`./settlement.html?year=${selectedYear}`">清算</a>
        <a :href="`./statistics.html?year=${selectedYear}`">統計情報</a>
        <a :href="`./index.html?year=${selectedYear}`">予約一覧</a>
        <a :href="`./image-list.html?year=${selectedYear}`">画像一覧</a>
        <a :href="`./form.html?year=${selectedYear}`" class="active">新規登録</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="cancellation-status" x-show="formData.representative.isCanceled === true" x-cloak>この予約はすでにキャンセルされています</div>
    <div class="delete-container">
      <button type="button" class="delete-btn" x-show="docId" @click="deleteForm">
        <i class="fa-regular fa-trash-can"></i> カルテを削除
      </button>
      <a :href="`./print.html?docId=${docId}`" target="_blank" class="print-btn" x-show="docId">
        <i class="fa-solid fa-print"></i> 印刷用ページ
      </a>
    </div>
    <form @submit.prevent="submitForm" @keydown.enter="($event.metaKey || $event.ctrlKey) ? ($event.preventDefault(), $el.requestSubmit()) : ($event.target.tagName !== 'TEXTAREA' && $event.preventDefault())">
      <fieldset :disabled="!user" class="border-0 p-0 m-0 min-w-0">
        <div class="form-section">
          <h2 class="section-title">代表者情報</h2>
          <div>
            <table class="form-table">
              <tr>
                <th>予約方法</th>
                <td>
                  <label>
                    <input type="radio" name="reservationMethod" value="じゃらん椿" @click="toggleRadio($event, 'reservationMethod')"
                      :checked="formData.representative.reservationMethod === 'じゃらん椿'"> じゃらん椿
                  </label>
                  <label>
                    <input type="radio" name="reservationMethod" value="じゃらん教室" @click="toggleRadio($event, 'reservationMethod')"
                      :checked="formData.representative.reservationMethod === 'じゃらん教室'"> じゃらん教室
                  </label>
                  <label>
                    <input type="radio" name="reservationMethod" value="アソビュー" @click="toggleRadio($event, 'reservationMethod')"
                      :checked="formData.representative.reservationMethod === 'アソビュー'"> アソビュー
                  </label>
                  <label>
                    <input type="radio" name="reservationMethod" value="ホームページ" @click="toggleRadio($event, 'reservationMethod')"
                      :checked="formData.representative.reservationMethod === 'ホームページ'"> ホームページ
                  </label>
                </td>
              </tr>
              <tr>
                <th>代表者名</th>
                <template x-if="!isNameSplit">
                  <td><input type="text" id="rep-name" x-model="formData.representative.name" required class="middle-width"></td>
                </template>
                <template x-if="isNameSplit">
                  <td>
                    <input type="text" id="rep-lastName" x-model="formData.representative.lastName" required placeholder="姓" class="small-width">
                    <input type="text" id="rep-firstName" x-model="formData.representative.firstName" required placeholder="名" class="small-width">
                  </td>
                </template>
              </tr>
              <tr>
                <th>ふりがな</th>
                <template x-if="!isNameSplit">
                  <td><input type="text" id="rep-kana" x-model="formData.representative.kana" class="middle-width"
                    x-init="$nextTick(() => bindAutoKana('rep-name', 'rep-kana', formData.representative, 'kana'))"></td>
                </template>
                <template x-if="isNameSplit">
                  <td>
                    <input type="text" id="rep-lastNameKana" x-model="formData.representative.lastNameKana" placeholder="せい" class="small-width"
                      x-init="$nextTick(() => bindAutoKana('rep-lastName', 'rep-lastNameKana', formData.representative, 'lastNameKana'))">
                    <input type="text" id="rep-firstNameKana" x-model="formData.representative.firstNameKana" placeholder="めい" class="small-width"
                      x-init="$nextTick(() => bindAutoKana('rep-firstName', 'rep-firstNameKana', formData.representative, 'firstNameKana'))">
                  </td>
                </template>
              </tr>
              <tr>
                <th>来店時間</th>
                <td><input type="time" x-model="formData.representative.visitTime" class="middle-width"></td>
              </tr>
              <tr>
                <th>人数</th>
                <td class="person-count">
                  女 <input type="number" min="0" x-model.number="formData.femaleCount" @change="updateCustomerList">
                  男 <input type="number" min="0" x-model.number="formData.maleCount" @change="updateCustomerList">
                </td>
              </tr>
              <tr>
                <th>住所</th>
                <td><input type="text" class="full-width" x-model="formData.representative.address"></td>
              </tr>
              <tr>
                <th>電話番号</th>
                <td><input type="tel" x-model="formData.representative.phone" inputmode="numeric" pattern="[0-9]*" class="middle-width"></td>
              </tr>
              <tr>
                <th>交通手段</th>
                <td>
                  <label class="transport-label">
                    <input type="radio" name="transportation" value="車" @click="toggleTransportation($event)"
                      :checked="formData.representative.transportation === '車'"> 車
                  </label>
                  <span class="sub-option-group" x-show="formData.representative.transportation === '車'">
                    <label class="chip-radio">
                      <input type="radio" name="transportationDetail" value="高速あり" @click="toggleRadio($event, 'transportationDetail')"
                        :checked="formData.representative.transportationDetail === '高速あり'"> 高速あり
                    </label>
                    <label class="chip-radio">
                      <input type="radio" name="transportationDetail" value="高速なし" @click="toggleRadio($event, 'transportationDetail')"
                        :checked="formData.representative.transportationDetail === '高速なし'"> 高速なし
                    </label>
                  </span>
                  <label class="transport-label">
                    <input type="radio" name="transportation" value="電車" @click="toggleTransportation($event)"
                      :checked="formData.representative.transportation === '電車'"> 電車
                  </label>
                  <span class="sub-option-group" x-show="formData.representative.transportation === '電車'">
                    <label class="chip-radio">
                      <input type="radio" name="transportationDetail" value="JR" @click="toggleRadio($event, 'transportationDetail')"
                        :checked="formData.representative.transportationDetail === 'JR'"> JR
                    </label>
                    <label class="chip-radio">
                      <input type="radio" name="transportationDetail" value="東武" @click="toggleRadio($event, 'transportationDetail')"
                        :checked="formData.representative.transportationDetail === '東武'"> 東武
                    </label>
                  </span>
                  <label class="transport-label">
                    <input type="radio" name="transportation" value="送迎" @click="toggleTransportation($event)"
                      :checked="formData.representative.transportation === '送迎'"> 送迎
                  </label>
                </td>
              </tr>
              <tr>
                <th>LINE</th>
                <td>
                  <label>
                    <input type="radio" name="lineType" value="教室LINE" @click="toggleRadio($event, 'lineType')"
                      :checked="formData.representative.lineType === '教室LINE'"> 教室LINE
                  </label>
                  <label>
                    <input type="radio" name="lineType" value="椿LINE" @click="toggleRadio($event, 'lineType')"
                      :checked="formData.representative.lineType === '椿LINE'"> 椿LINE
                  </label>
                  <label>
                    <input type="radio" name="lineType" value="お客様LINE" @click="toggleRadio($event, 'lineType')"
                      :checked="formData.representative.lineType === 'お客様LINE'"> お客様LINE
                  </label>
                </td>
              </tr>
              <tr>
                <th>備考</th>
                <td><input type="text" class="full-width" x-model="formData.representative.notes"></td>
              </tr>
              <tr>
                <th>リピーター</th>
                <td>
                  <template x-if="formData.representative.repeaterYears.length === 0">
                    <button type="button" class="checking-btn" @click="checkRepeaterStatus()">電話番号を照合してリピーターかどうかチェックする</button>
                  </template>
                  <template x-if="formData.representative.repeaterYears.length > 0">
                    <div>
                      <span x-show="formData.representative.repeaterYears.includes(0)">新規</span>
                      <span x-show="!formData.representative.repeaterYears.includes(0)" x-text="formData.representative.repeaterYears.join(', ')"></span>
                      <input type="text" x-model="formData.representative.repeaterNote" placeholder="メモ">
                    </div>
                  </template>
                </td>
              </tr>
              <tr>
                <th>お伝え事項</th>
                <td>
                  <label><input type="checkbox" x-model="formData.representative.checkpoints.rentalPage"> 浴衣レンタルページ</label>
                  <label><input type="checkbox" x-model="formData.representative.checkpoints.footwearBag"> 履物バッグ</label>
                  <label><input type="checkbox" x-model="formData.representative.checkpoints.price"> 料金</label>
                  <label><input type="checkbox" x-model="formData.representative.checkpoints.location"> 当店の場所</label>
                  <label><input type="checkbox" x-model="formData.representative.checkpoints.parking"> 駐車場</label>
                </td>
              </tr>
              <tr>
                <th>支払い区分</th>
                <td>
                  <label><input type="radio" name="paymentType" value="group" x-model="formData.representative.paymentType" @click="toggleRadio($event, 'paymentType')" :checked="formData.representative.paymentType === 'group'"> グループでまとめて</label>
                  <label><input type="radio" name="paymentType" value="individual" x-model="formData.representative.paymentType" @click="toggleRadio($event, 'paymentType')" :checked="formData.representative.paymentType === 'individual'"> 個別で支払い</label>
                </td>
              </tr>
            </table>
          </div>
        </div>

        <div class="customer-details-grid">
          <div class="customer-column-header">
            <div class="header-item">名前</div>
            <div class="header-item">性別</div>
            <div class="header-item">体型</div>
            <div class="header-item">身長,足のサイズ</div>
            <div class="header-item">着付種別</div>
            <div class="header-item">オプション</div>
            <div class="header-item">追加レンタル</div>
            <div class="header-item">画像アップロード</div>
            <div class="header-item">合計</div>
            <div class="header-item" x-show="formData.representative.paymentType === 'individual'">支払い方法</div>
          </div>

          <template x-for="(customer, customerIndex) in formData.customers" :key="customer.id">
            <div class="customer-column">
              <div class="form-cell flex flex-col">
                <template x-if="!isNameSplit">
                <input type="text" :id="'customer-kana-' + customerIndex" x-model="customer.kana" class="h-4 text-xs w-[191.8px]" placeholder="ふりがな"
                  x-init="$nextTick(() => bindAutoKana('customer-name-' + customerIndex, 'customer-kana-' + customerIndex, customer, 'kana'))">
                </template>
                <template x-if="!isNameSplit">
                <input type="text" :id="'customer-name-' + customerIndex" x-model="customer.name" placeholder="名前">
                </template>
                <template x-if="isNameSplit">
                <div class="flex gap-1">
                  <input type="text" :id="'customer-lastNameKana-' + customerIndex" x-model="customer.lastNameKana" class="h-4 text-xs small-width" placeholder="せい"
                    x-init="$nextTick(() => bindAutoKana('customer-lastName-' + customerIndex, 'customer-lastNameKana-' + customerIndex, customer, 'lastNameKana'))">
                  <input type="text" :id="'customer-firstNameKana-' + customerIndex" x-model="customer.firstNameKana" class="h-4 text-xs small-width" placeholder="めい"
                    x-init="$nextTick(() => bindAutoKana('customer-firstName-' + customerIndex, 'customer-firstNameKana-' + customerIndex, customer, 'firstNameKana'))">
                </div>
                </template>
                <template x-if="isNameSplit">
                <div class="flex gap-1">
                  <input type="text" :id="'customer-lastName-' + customerIndex" x-model="customer.lastName" placeholder="姓" class="small-width">
                  <input type="text" :id="'customer-firstName-' + customerIndex" x-model="customer.firstName" placeholder="名" class="small-width">
                </div>
                </template>
              </div>
              <div class="form-cell">
                <label><input type="radio" :name="'gender' + customerIndex" value="female" x-model="customer.gender"> 女</label>
                <label><input type="radio" :name="'gender' + customerIndex" value="male" x-model="customer.gender"> 男</label>
                <label><input type="checkbox" x-model="customer.isChild"> 子供</label>
              </div>
              <div class="form-cell body-shape-cell">
                <div class="text-center">
                  <select x-model="customer.bodyShape" class="body-shape-select">
                    <option value="">--</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="2L">2L</option>
                    <option value="3L">3L</option>
                    <option value="5L">5L</option>
                  </select>
                  <input type="number" class="small-input" x-model.number="customer.weight" min="0">
                  <span x-text="customer.gender === 'female' ? '号' : 'kg'"></span>
                </div>
                <input type="text" x-model="customer.bodyShapeMemo" placeholder="体型メモ" class="body-shape-memo-input">
              </div>
              <div class="form-cell">
                身長 <input type="number" class="small-input" x-model.number="customer.height" min="0" step="0.1"> cm
                足 <input type="number" class="small-input" x-model.number="customer.footSize" min="0" step="0.1"> cm
              </div>
              <div class="form-cell">
                <label><input type="radio" :name="'dressingType' + customerIndex" value="レンタル&着付" x-model="customer.dressingType"> レンタル＆着付</label>
                <label><input type="radio" :name="'dressingType' + customerIndex" value="着付のみ" x-model="customer.dressingType"> 着付のみ</label>
              </div>
              <div class="form-cell">
                <label><input type="checkbox" x-model="customer.options.footwear"> 履き物</label>
                <label x-show="customer.gender === 'female'"><input type="checkbox" x-model="customer.options.obiBag"> かごバッグ</label>
              </div>
              <!-- 追加レンタル -->
              <div class="form-cell">
                <ul class="rental-list">
                  <template x-for="(item, itemIndex) in customer.additionalRentals" :key="itemIndex">
                    <li>
                      <span x-text="`${item.name} ${formatYen(item.price)}`"></span>
                      <button type="button" class="delete-btn" @click="removeRentalItem(customerIndex, itemIndex)"><i class="fa-regular fa-trash-can"></i></button>
                    </li>
                  </template>
                </ul>
                <button type="button" class="add-btn" @click="openRentalModal(customerIndex)"><i class="fa-solid fa-circle-plus"></i></button>
              </div>
              <div class="form-cell flex justify-around">
                <div class="preview-container">
                  <!-- 保存済み -->
                  <template x-for="(url, imageIndex) in customer.imageUrls" :key="url">
                    <div class="flex gap-1 border border-gray-400 p-1">
                      <img :src="url" class="preview-image" @click="openImageModal(url)">
                      <button type="button" class="btn-del" @click="removeMedia(customerIndex,'saved-image',imageIndex)">
                        <i class="fa-solid fa-trash"></i>
                      </button>
                    </div>
                  </template>
                  <!-- 新規追加プレビュー -->
                  <template x-for="(src, imageIndex) in customer.newImagePreviews" :key="src">
                    <div class="flex gap-1 border border-gray-400 p-1">
                      <img :src="src" class="preview-image" @click="openImageModal(src)">
                      <button type="button" class="btn-del" @click="removeMedia(customerIndex,'new-image',imageIndex)">
                        <i class="fa-solid fa-trash"></i>
                      </button>
                    </div>
                  </template>
                </div>
                <label class="file-upload-label">
                  <i class="fa-solid fa-camera"></i>
                  <input type="file" multiple accept="image/*" @change="prepareMediaPreview($event, customerIndex)">
                </label>
              </div>
              <div class="form-cell">
                <div x-show="formData.representative.reservationMethod && formData.representative.reservationMethod !== 'ホームページ'">
                  前払：<span x-text="formatYen(calculateCustomerPrepayment(customer))"></span>
                </div>
                <div x-show="calculateCustomerOnSitePayment(customer) > 0">
                  現地：
                  <span class="discounted" x-show="customer.discountAmount">
                    <span class="old-price" x-text="formatYen(calculateCustomerOnSitePayment(customer))"></span>
                    →
                    <span :class="customer.discountAmount < 0 ? 'increased-price' : 'new-price'" x-text="formatYen(calculateCustomerOnSitePaymentAdjusted(customer))"></span>
                  </span>
                  <span x-text="formatYen(calculateCustomerOnSitePayment(customer))" x-show="!customer.discountAmount"></span>
                  <button type="button" class="edit-btn" @click="openDiscountModal(customerIndex)">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                </div>
              </div>
              <!-- 個別の支払い方法 -->
              <div class="form-cell" x-show="formData.representative.paymentType==='individual'">
                <label><input type="radio" :name="'paymentMethod' + customerIndex" value="現金" x-model="customer.paymentMethod" @click="toggleCustomerRadio($event, 'paymentMethod', customerIndex)" :checked="customer.paymentMethod === '現金'"> 現金</label>
                <label><input type="radio" :name="'paymentMethod' + customerIndex" value="PayPay" x-model="customer.paymentMethod" @click="toggleCustomerRadio($event, 'paymentMethod', customerIndex)" :checked="customer.paymentMethod === 'PayPay'"> PayPay</label>
                <label><input type="radio" :name="'paymentMethod' + customerIndex" value="振込" x-model="customer.paymentMethod" @click="toggleCustomerRadio($event, 'paymentMethod', customerIndex)" :checked="customer.paymentMethod === '振込'"> 振込</label>
                <input type="text" x-model="customer.paymentNote" placeholder="支払いに関するメモ" class="payment-note-input">
              </div>
            </div>
          </template>
        </div>

        <div class="form-section totals-section">
          <span>グループ合計</span>
          <span x-show="formData.representative.reservationMethod && formData.representative.reservationMethod !== 'ホームページ'">
            前払：<span x-text="formatYen(totalPrepayment)"></span>
          </span>
          <span x-show="totalOnSitePayment > 0">
            現地：
            <!-- 金額調整がある場合は線付きで表示 -->
            <span class="discounted" x-show="formData.customers.some(c => c.discountAmount)">
              <span class="old-price" x-text="formatYen(totalOnSitePayment)"></span>
              →
              <span :class="totalOnSitePaymentAdjusted > totalOnSitePayment ? 'increased-price' : 'new-price'" x-text="formatYen(totalOnSitePaymentAdjusted)"></span>
            </span>
            <span x-text="formatYen(totalOnSitePayment)" x-show="!formData.customers.some(c => c.discountAmount)"></span>
            <button type="button" class="payment-status-btn" :class="{ 'is-paid': formData.representative.isPaid }"
              @click="if (!formData.representative.isPaid || confirm('未決済に戻しますか？')) formData.representative.isPaid = !formData.representative.isPaid">
              <i class="fa-solid fa-check" x-show="formData.representative.isPaid"></i>
              <span x-text="formData.representative.isPaid ? '決済済み' : '決済済みにする'"></span>
            </button>
          </span>
          <div class="group-payment-method" x-show="formData.representative.paymentType === 'group'">
            支払い方法：
            <label><input type="radio" name="groupPaymentMethod" value="現金" x-model="formData.representative.groupPaymentMethod" @click="toggleRadio($event, 'groupPaymentMethod')" :checked="formData.representative.groupPaymentMethod === '現金'"> 現金</label>
            <label><input type="radio" name="groupPaymentMethod" value="PayPay" x-model="formData.representative.groupPaymentMethod" @click="toggleRadio($event, 'groupPaymentMethod')" :checked="formData.representative.groupPaymentMethod === 'PayPay'"> PayPay</label>
            <label><input type="radio" name="groupPaymentMethod" value="振込" x-model="formData.representative.groupPaymentMethod" @click="toggleRadio($event, 'groupPaymentMethod')" :checked="formData.representative.groupPaymentMethod === '振込'"> 振込</label>
            <input type="text" x-model="formData.representative.groupPaymentNote" placeholder="支払いに関するメモ" class="payment-note-input">
          </div>
          <button type="button" class="receipt-open-btn" @click="receiptModal.isOpen = true" x-show="totalOnSitePayment > 0 || totalPrepayment > 0">
            <i class="fa-solid fa-receipt"></i> お客様に会計を見せる
          </button>
        </div>

        <div class="submit-container">
          <button type="submit" class="submit-btn" :class="{ 'is-dirty': isDirty }" :disabled="isSubmitting"
            x-text="isSubmitting ? '処理中...' : (docId ? '更新' : '登録')"></button>
        </div>
        <div class="cancellation-status" x-show="docId != null">
          <label for="cancellation-toggle">
            <input type="checkbox" id="cancellation-toggle" x-model="formData.representative.isCanceled">
            <span>キャンセルの時はここにチェックをつけて更新</span>
          </label>
        </div>
      </fieldset>
    </form>
  </main>

  <div class="modal-overlay" x-show="rentalModal.isOpen" @click="rentalModal.isOpen = false" x-cloak>
    <div class="modal-content" @click.stop>
      <h3>レンタル追加登録</h3>
      <div class="modal-form">
        <label>項目</label>
        <input type="text" x-model="rentalModal.input.name">
      </div>
      <div class="modal-form">
        <label>価格(円)</label>
        <input type="number" x-model.number="rentalModal.input.price">
      </div>
      <button class="submit-btn" @click="addRentalItem()">追加登録</button>
    </div>
  </div>

  <div class="modal-overlay" x-show="discountModal.isOpen" @click="discountModal.isOpen = false" x-cloak>
    <div class="modal-content discount-modal" @click.stop>
      <h3>現地支払い金額の修正</h3>

      <div class="price-box">
        <div>
          <span class="label">元の金額</span>
          <span class="value" x-text="formatYen(discountModal.originalPrice)"></span>
        </div>
        <div>
          <span class="label">区分</span>
          <span class="value">
            <label class="chip-radio">
              <input type="radio" name="discountType" value="discount" @click="discountModal.input.type = 'discount'"
                :checked="discountModal.input.type === 'discount'"> 値引き
            </label>
            <label class="chip-radio">
              <input type="radio" name="discountType" value="surcharge" @click="discountModal.input.type = 'surcharge'"
                :checked="discountModal.input.type === 'surcharge'"> 追加請求
            </label>
          </span>
        </div>
        <div>
          <span class="label">金額</span>
          <span class="value">
            <input type="number" min="0" x-model.number="discountModal.input.amount" class="discount-input"> 円
          </span>
        </div>
        <div>
          <span class="label">修正後の金額</span>
          <span class="value adjusted" x-text="formatYen(discountModal.originalPrice - (discountModal.input.type === 'surcharge' ? -1 : 1) * (discountModal.input.amount || 0))"></span>
        </div>
        <div class="memo-row">
          <label>メモ</label>
          <textarea x-model="discountModal.input.memo" rows="3" class="memo-textarea"></textarea>
        </div>
      </div>
      <button class="submit-btn" @click="applyDiscount()">確定</button>
    </div>
  </div>

  <div class="modal-overlay receipt-overlay" x-show="receiptModal.isOpen" @click="receiptModal.isOpen = false" x-cloak>
    <div class="modal-content receipt-modal" @click.stop>
      <button type="button" class="receipt-close-btn" @click="receiptModal.isOpen = false">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="receipt-representative">代表者：<span x-text="formData.representative.name"></span> 様</div>
      <ul class="receipt-items">
        <template x-for="item in receiptItems" :key="item.label + item.price + item.variant">
          <li>
            <span class="receipt-item-label">
              <span x-text="item.label"></span>
              <span x-show="item.variant === 'adult'">（大人）</span>
              <span x-show="item.variant === 'child'">（子供<img src="../assets/img/child-icon.png" alt="" class="receipt-item-icon-inline">）</span>
              <span x-show="item.qty > 1" x-text="'× ' + item.qty"></span>
              <img src="../assets/img/geta-icon.png" alt="" class="receipt-item-icon" x-show="item.label === 'レンタル履き物'">
            </span>
            <span x-text="formatYen(item.price * item.qty)"></span>
          </li>
        </template>
        <li x-show="totalDiscount">
          <span x-text="totalDiscount > 0 ? '値引き' : '追加請求'"></span>
          <span x-text="formatYen(-totalDiscount)"></span>
        </li>
      </ul>
      <div class="receipt-total">
        <span>合計</span>
        <span x-text="formatYen(totalOnSitePaymentAdjusted)"></span>
      </div>
    </div>
  </div>

  <div x-show="selectedImageUrl" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" @click.self="selectedImageUrl = null">
    <img :src="selectedImageUrl" class="max-w-[90%] max-h-[90%] rounded-lg shadow-lg object-contain" />
  </div>
</body>

</html>
